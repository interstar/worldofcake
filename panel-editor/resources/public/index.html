<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World of Cake · Panel editor</title><link rel="stylesheet" href="/editor.css"></head>
<body><header><div><strong>World of Cake</strong><span class="muted"> / Panel editor</span></div><div class="actions"><label>Panel <select id="app" aria-label="Panel"></select></label><button id="reload">Reload</button><button id="save" class="primary" disabled>Save pair</button><span id="saved" role="status">Loading…</span></div></header>
<main><section class="sources"><nav role="tablist" aria-label="Panel source"><button id="tab-layla" role="tab" aria-selected="true" aria-controls="layla">Layla</button><button id="tab-edn" role="tab" aria-selected="false" aria-controls="edn">EDN</button><span id="filename">layouts/openfl/</span></nav><textarea id="layla" role="tabpanel" aria-labelledby="tab-layla" spellcheck="false" aria-label="Layla source"></textarea><textarea id="edn" role="tabpanel" aria-labelledby="tab-edn" spellcheck="false" aria-label="EDN source" hidden></textarea><div class="source-foot">Source editing · Ctrl/Cmd+S saves both files · Tab inserts two spaces</div></section>
<section class="preview"><div class="preview-toolbar"><span>OpenFL panel</span><div class="actions"><label><input type="checkbox" id="bounds"> Bounds</label><label>Zoom <select id="zoom"><option value="fit">Fit</option><option value="0.5">50%</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><span id="dimensions"></span></div></div><div id="diagnostics" role="status">Loading panel…</div><div id="viewport"><div id="paper"><canvas id="panel" aria-label="Static panel preview"></canvas></div></div><footer>Canvas approximation of WoC OpenFL widgets · controls show EDN defaults · play areas are placeholders</footer></section></main><script src="/js/editor.js"></script></body></html>
