# ui_layouts.yaml
# Reference layouts for all WorldOfCake apps

# Common settings used across apps
common:
  standardWindow:
    width: 800
    height: 600
  playAreaStandard:
    x: 20
    y: 20
    width: 600
    height: 600

# TileLand app
tileland:
  window:
    width: 800
    height: 600
    title: "TileLand"
  
  components:
    playArea:
      type: PlayArea
      uid: 1
      x: 20
      y: 20
      width: 600
      height: 600

    speedControls:
      - type: Slider
        uid: 10
        x: 640
        y: 50
        width: 30
        height: 150
        label: "Red Speed"
        min: 1.0
        max: 32.0
        vertical: true
        defaultValue: 16.0

      - type: Slider
        uid: 11
        x: 680
        y: 50
        width: 30
        height: 150
        label: "Green Speed"
        min: 1.0
        max: 32.0
        vertical: true
        defaultValue: 16.0

      - type: Slider
        uid: 12
        x: 720
        y: 50
        width: 30
        height: 150
        label: "Blue Speed"
        min: 1.0
        max: 32.0
        vertical: true
        defaultValue: 16.0

    channelControl:
      type: Slider
      uid: 20
      x: 640
      y: 250
      width: 120
      height: 30
      label: "MIDI Channel"
      min: 1
      max: 14
      vertical: false
      defaultValue: 1

